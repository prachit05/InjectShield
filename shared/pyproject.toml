[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "injectshield-shared"
version = "0.1.0"
description = "Schemas and settings shared by the InjectShield API and worker"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pydantic-settings>=2.2", "boto3>=1.34"]

[tool.setuptools.packages.find]
include = ["injectshield_shared*"]
