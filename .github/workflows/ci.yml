name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: injectshield
          POSTGRES_PASSWORD: injectshield
          POSTGRES_DB: injectshield
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U injectshield"
          --health-interval 2s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://injectshield:injectshield@localhost:5432/injectshield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            api/requirements.txt
            worker/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Detection accuracy on the sample set
        run: python -m injectshield_worker.evaluate tests/sample_prompts
        env:
          PYTHONPATH: shared:worker

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile -t injectshield-api .
      - run: docker build -f worker/Dockerfile -t injectshield-worker .
