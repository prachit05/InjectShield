AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  InjectShield identity: Cognito user pool and a public app client (requirement F1).
  Users sign up with their email; the frontend talks to Cognito directly
  (SignUp / ConfirmSignUp / InitiateAuth), so no callback URLs are needed and this
  stack does not depend on the CloudFront domain.

Parameters:
  ProjectName:
    Type: String
    Default: injectshield
    AllowedPattern: "^[a-z][a-z0-9-]{2,20}$"

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Delete # teardown.sh must leave nothing behind
    UpdateReplacePolicy: Delete
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration: { CaseSensitive: false }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your InjectShield verification code
        EmailMessage: "Your InjectShield verification code is {####}"
      DeletionProtection: INACTIVE
      UserPoolTags:
        Project: !Ref ProjectName

  # Public client (no secret): it runs in the browser. Tokens are short-lived;
  # the refresh token keeps a session going for a day.
  AppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 24
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: hours

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export: { Name: !Sub "${ProjectName}-UserPoolId" }
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export: { Name: !Sub "${ProjectName}-UserPoolArn" }
  AppClientId:
    Value: !Ref AppClient
    Export: { Name: !Sub "${ProjectName}-AppClientId" }
