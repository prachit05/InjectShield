AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  InjectShield monitoring (requirement N4): one CloudWatch dashboard with queue
  depth, running tasks, scan latency, throughput and errors, plus alarms on the
  dead-letter queue, scan errors and API 5xx responses.

Parameters:
  ProjectName:
    Type: String
    Default: injectshield
    AllowedPattern: "^[a-z][a-z0-9-]{2,20}$"
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional. Alarm notifications go here (confirm the SNS email once).
  ScanErrorThreshold:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Scan errors in 5 minutes that trigger the errors alarm.
  Api5xxThreshold:
    Type: Number
    Default: 5
    MinValue: 1
    Description: 5xx responses in 5 minutes that trigger the API alarm.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-alarms"
      KmsMasterKeyId: alias/aws/sns
      Subscription: !If
        - HasAlarmEmail
        - [{ Protocol: email, Endpoint: !Ref AlarmEmail }]
        - !Ref AWS::NoValue
      Tags:
        - { Key: Project, Value: !Ref ProjectName }

  # A job reaches the DLQ only after 3 failed attempts, so one message is worth a look.
  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-dlq-not-empty"
      AlarmDescription: Scan jobs failed 3 times and were moved to the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !ImportValue { "Fn::Sub": "${ProjectName}-DeadLetterQueueName" }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  ScanErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-scan-errors"
      AlarmDescription: Workers are failing scans (ScanErrors from the worker EMF logs).
      Namespace: InjectShield
      MetricName: ScanErrors
      Dimensions:
        - { Name: Service, Value: worker }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref ScanErrorThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-api-5xx"
      AlarmDescription: The API (or the ALB in front of it) is returning 5xx responses.
      Metrics:
        - Id: total
          Expression: "FILL(target, 0) + FILL(elb, 0)"
          Label: 5xx responses
          ReturnData: true
        - Id: target
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_5XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !ImportValue { "Fn::Sub": "${ProjectName}-LoadBalancerFullName" }
            Period: 300
            Stat: Sum
        - Id: elb
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_ELB_5XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !ImportValue { "Fn::Sub": "${ProjectName}-LoadBalancerFullName" }
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: !Ref Api5xxThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref ProjectName
      DashboardBody: !Sub
        - |
          {
            "start": "-PT3H",
            "widgets": [
              {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2, "properties": {"markdown":
                "## InjectShield\nPOST /scan stores, records and queues; workers scale on scan-queue depth and write verdicts. Alarms: DLQ not empty, scan errors, API 5xx."}},

              {"type": "metric", "x": 0, "y": 2, "width": 12, "height": 6, "properties": {
                "title": "Scan queue depth", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60,
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${ScanQueue}", {"label": "Visible (waiting)"}],
                  [".", "ApproximateNumberOfMessagesNotVisible", ".", ".", {"label": "In flight (scanning)"}],
                  [".", "ApproximateNumberOfMessagesVisible", ".", "${DeadLetterQueue}", {"label": "Dead-letter queue", "color": "#d62728"}]
                ]}},

              {"type": "metric", "x": 12, "y": 2, "width": 12, "height": 6, "properties": {
                "title": "Running tasks", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 60,
                "metrics": [
                  ["ECS/ContainerInsights", "RunningTaskCount", "ClusterName", "${Cluster}", "ServiceName", "${WorkerService}", {"label": "Workers"}],
                  ["...", "${ApiService}", {"label": "API"}]
                ],
                "yAxis": {"left": {"min": 0}}}},

              {"type": "metric", "x": 0, "y": 8, "width": 12, "height": 6, "properties": {
                "title": "Scan latency (ms)", "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                "metrics": [
                  ["InjectShield", "ScanLatency", "Service", "worker", {"stat": "p50", "label": "Scan p50"}],
                  ["...", {"stat": "p95", "label": "Scan p95"}],
                  [".", "EndToEndLatency", ".", ".", {"stat": "p95", "label": "Submit to verdict p95"}]
                ]}},

              {"type": "metric", "x": 12, "y": 8, "width": 12, "height": 6, "properties": {
                "title": "Throughput and errors", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
                "metrics": [
                  ["InjectShield", "JobsCompleted", "Service", "worker", {"label": "Jobs completed"}],
                  [".", "ScanErrors", ".", ".", {"label": "Scan errors", "color": "#d62728"}],
                  ["AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "LoadBalancer", "${LoadBalancer}", {"label": "API 5xx", "color": "#ff7f0e"}]
                ]}},

              {"type": "metric", "x": 0, "y": 14, "width": 12, "height": 6, "properties": {
                "title": "API requests and response time", "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                "metrics": [
                  ["AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${LoadBalancer}", {"stat": "Sum", "label": "Requests"}],
                  [".", "TargetResponseTime", ".", ".", {"stat": "p95", "label": "Response time p95 (s)", "yAxis": "right"}]
                ]}},

              {"type": "metric", "x": 12, "y": 14, "width": 12, "height": 6, "properties": {
                "title": "Worker CPU and memory (%)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 60,
                "metrics": [
                  ["AWS/ECS", "CPUUtilization", "ClusterName", "${Cluster}", "ServiceName", "${WorkerService}", {"label": "CPU"}],
                  [".", "MemoryUtilization", ".", ".", ".", ".", {"label": "Memory"}]
                ],
                "yAxis": {"left": {"min": 0, "max": 100}}}},

              {"type": "alarm", "x": 0, "y": 20, "width": 24, "height": 3, "properties": {
                "title": "Alarms", "alarms": ["${DeadLetterAlarm.Arn}", "${ScanErrorsAlarm.Arn}", "${Api5xxAlarm.Arn}"]}}
            ]
          }
        - ScanQueue: !ImportValue { "Fn::Sub": "${ProjectName}-ScanQueueName" }
          DeadLetterQueue: !ImportValue { "Fn::Sub": "${ProjectName}-DeadLetterQueueName" }
          Cluster: !ImportValue { "Fn::Sub": "${ProjectName}-ClusterName" }
          ApiService: !ImportValue { "Fn::Sub": "${ProjectName}-ApiServiceName" }
          WorkerService: !ImportValue { "Fn::Sub": "${ProjectName}-WorkerServiceName" }
          LoadBalancer: !ImportValue { "Fn::Sub": "${ProjectName}-LoadBalancerFullName" }

Outputs:
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${ProjectName}"
  AlarmTopicArn:
    Value: !Ref AlarmTopic
